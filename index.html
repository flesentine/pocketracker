<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Tracker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-shell" aria-label="Pocket tracker prototype">
      <header class="top-bar">
        <button class="icon-button" aria-label="Open menu">PT</button>
        <div>
          <p class="eyebrow">Pattern 04</p>
          <h1>Pocket Tracker</h1>
        </div>
        <button class="icon-button" id="demoButton" aria-label="Load demo song">Demo</button>
      </header>

      <section class="status-strip" aria-label="Playback status">
        <button class="status-button" id="bpmTile" aria-label="Open tempo control">
          <span>BPM</span>
          <strong id="bpmReadout">126</strong>
        </button>
        <div>
          <span>CH</span>
          <strong id="channelReadout">01</strong>
        </div>
        <div>
          <span>ROW</span>
          <strong id="rowReadout">08</strong>
        </div>
        <div>
          <span>OCT</span>
          <strong id="octaveReadout">03</strong>
        </div>
      </section>

      <section class="pattern-panel" aria-label="Pattern editor">
        <div class="pattern-hint">Tap cell to edit · Swipe rows</div>
        <div class="channel-head">
          <span></span>
          <span>CH 1</span>
          <span>CH 2</span>
          <span>CH 3</span>
          <span>CH 4</span>
        </div>
        <div class="pattern-grid" id="patternGrid"></div>
      </section>

      <section class="sample-deck" aria-label="Selected sample">
        <div class="sample-meta">
          <div>
            <p class="eyebrow">Selected Sample</p>
            <h2 id="sampleName">03 Bassline</h2>
          </div>
          <span class="pill" id="sampleCode">03</span>
        </div>
        <div class="instrument-bank" id="instrumentBank" aria-label="More instruments">
          <button class="sample-pad compact" data-code="05" data-name="05 Hat">05<br />Hat</button>
          <button class="sample-pad compact" data-code="06" data-name="06 Pluck">06<br />Pluck</button>
          <button class="sample-pad compact" data-code="07" data-name="07 Chord">07<br />Chord</button>
          <button class="sample-pad compact" data-code="08" data-name="08 Bell">08<br />Bell</button>
        </div>
        <div class="sample-rack" id="sampleRack" aria-label="Sample rack">
          <button class="sample-pad" data-code="01" data-name="01 Kick">01<br />Kick</button>
          <button class="sample-pad" data-code="02" data-name="02 Snare">02<br />Snare</button>
          <button class="sample-pad active" data-code="03" data-name="03 Bassline">03<br />Bass</button>
          <button class="sample-pad" data-code="04" data-name="04 Lead">04<br />Lead</button>
        </div>
      </section>

      <section class="thumb-deck" aria-label="Cell edit controls">
        <div class="tempo-panel" id="tempoPanel" hidden>
          <button class="tempo-step" id="bpmDown" aria-label="Decrease BPM">-</button>
          <label class="tempo-slider">
            <span>Tempo</span>
            <input id="bpmSlider" type="range" min="80" max="180" value="126" />
          </label>
          <button class="tempo-step" id="bpmUp" aria-label="Increase BPM">+</button>
          <button class="tempo-done" id="tempoDone">Done</button>
        </div>
        <div class="volume-control">
          <label for="volumeSlider">Vol <strong id="volumeReadout">48</strong></label>
          <input id="volumeSlider" type="range" min="0" max="64" value="48" />
          <button id="clearCell">Clear</button>
        </div>
        <div class="piano-keyboard" id="editorNoteGrid" aria-label="Notes">
          <button class="white-key" data-note="C">C</button>
          <button class="white-key" data-note="D">D</button>
          <button class="white-key" data-note="E">E</button>
          <button class="white-key" data-note="F">F</button>
          <button class="white-key" data-note="G">G</button>
          <button class="white-key" data-note="A">A</button>
          <button class="white-key" data-note="B">B</button>
          <button class="black-key key-cs" data-note="C#" aria-label="C sharp"></button>
          <button class="black-key key-ds" data-note="D#" aria-label="D sharp"></button>
          <button class="black-key key-fs" data-note="F#" aria-label="F sharp"></button>
          <button class="black-key key-gs" data-note="G#" aria-label="G sharp"></button>
          <button class="black-key key-as" data-note="A#" aria-label="A sharp"></button>
        </div>
        <div class="transport">
          <button class="secondary" id="octaveDown">OCT -</button>
          <button class="play" id="playButton">Play</button>
          <button class="secondary" id="octaveUp">OCT +</button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
